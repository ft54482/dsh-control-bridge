name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Host plugin contract
        run: node --test --test-force-exit plugins/dsh-control-bridge-host/test/host.test.js plugins/dsh-control-bridge-host/test/official-contract.test.js plugins/dsh-control-bridge-host/test/lifecycle.test.js plugins/dsh-control-bridge-host/test/rearm.test.js
      - name: Fake end to end
        run: python examples/e2e_fake.py
