# Example only. Copy to a private path before use:
#   mkdir -p ~/.dsh-control-bridge
#   cp examples/credentials.example.toml ~/.dsh-control-bridge/credentials.toml
# The bridge refuses to read a credentials file that sits inside the git work tree.
# Replace every placeholder locally. Do not commit the copy.

[webhook]
shared_secret = "replace-with-local-secret"

[instances.local-desktop]
token = "replace-with-token"

[instances.lab-server]
token = "replace-with-token"
